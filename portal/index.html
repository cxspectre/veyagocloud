<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal sign-in | Veyago</title>
  <meta name="description" content="The Veyago Client Portal will carry your project status, the scope you agreed, invoices and handover files. It is not open yet." />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <link rel="canonical" href="https://www.veyago.cloud/portal/" />
  <meta name="robots" content="noindex,follow" />
  <meta property="og:title" content="Client Portal sign-in | Veyago" />
  <meta property="og:description" content="The Veyago Client Portal will carry your project status, the scope you agreed, invoices and handover files. It is not open yet." />
  <meta property="og:url" content="https://www.veyago.cloud/portal/" />
  <meta property="og:site_name" content="Veyago" />
  <meta property="og:type" content="website" />
</head>
<body>
  <a class="auth-back" href="/login/">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>

  <main class="auth" id="main">
    <div class="auth-inner auth-inner-narrow">
      <div class="auth-panel">
        <span class="auth-tile auth-tile-client" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.55"/><path d="M4.8 19.6a7.4 7.4 0 0 1 14.4 0" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg>
        </span>
        <h1>Veyago Client Portal</h1>
        <p class="auth-lede">Not open yet. Everything it will hold is a reply away.</p>
        <a class="auth-btn" href="mailto:hello@veyago.cloud?subject=Client%20Portal%20access">
          Email us
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <p class="auth-note">Need help with something live? <a href="/support/">Support</a></p>
    </div>
  </main>
</body>
</html>
