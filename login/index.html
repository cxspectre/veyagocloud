<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Veyago</title>
  <meta name="description" content="Sign in to Veyago: the Workspace the studio runs on, or the Client Portal that carries your project, scope, invoices and files." />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <link rel="canonical" href="https://www.veyago.cloud/login/" />
  <meta name="robots" content="noindex,follow" />
  <meta property="og:title" content="Sign in | Veyago" />
  <meta property="og:description" content="Sign in to Veyago: the Workspace the studio runs on, or the Client Portal that carries your project, scope, invoices and files." />
  <meta property="og:url" content="https://www.veyago.cloud/login/" />
  <meta property="og:site_name" content="Veyago" />
  <meta property="og:type" content="website" />
</head>
<body>
  <a class="auth-back" href="/">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>

  <main class="auth" id="main">
    <div class="auth-inner">
      <h1>Sign in to Veyago.</h1>

      <div class="auth-choices">
        <a class="auth-choice" href="https://workspace.veyago.cloud/">
          <span class="auth-tile auth-tile-studio" aria-hidden="true">V</span>
          <span class="auth-eyebrow">For the studio</span>
          <h2>Veyago Workspace</h2>
          <p>Mail, tickets, projects and the day's numbers.</p>
          <span class="auth-btn">
            Sign in
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>

        <div class="auth-rule" aria-hidden="true"></div>

        <a class="auth-choice" href="/portal/">
          <span class="auth-tile auth-tile-client" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.55"/><path d="M4.8 19.6a7.4 7.4 0 0 1 14.4 0" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg>
          </span>
          <span class="auth-eyebrow">For clients</span>
          <h2>Veyago Client Portal</h2>
          <p>Your project, its scope, invoices and files.</p>
          <span class="auth-btn">
            Sign in
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
