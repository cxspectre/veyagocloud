<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Projects</h1>
          <p>In-house R&amp;D — from a question to a shipped product.</p>
        </div>
        <div class="adm-actions">
          <button class="btn btn-primary" id="new-btn" type="button">+ New project</button>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite" style="margin-bottom:12px"></p>
      <ul class="adm-list" id="proj-list"></ul>

      <section class="card-pane" id="proj-form" hidden style="margin-top:24px">
        <h2 id="form-title">New project</h2>
        <div class="row-2">
          <div class="field"><label for="pr-name">Name</label><input class="input" id="pr-name" type="text" /></div>
          <div class="field">
            <label for="pr-stage">Stage</label>
            <select class="select" id="pr-stage">
              <option value="researching">Researching</option>
              <option value="prototyping">Prototyping</option>
              <option value="building">Building</option>
              <option value="graduated">Graduated</option>
            </select>
          </div>
        </div>
        <div class="field"><label for="pr-question">Research question</label><textarea class="textarea" id="pr-question" rows="2"></textarea></div>
        <div class="field"><label for="pr-finding">Finding / where it stands</label><textarea class="textarea" id="pr-finding" rows="4"></textarea></div>
        <div class="row-2">
          <div class="field"><label for="pr-essay-title">Working paper title <span style="font-weight:400;color:var(--muted-2)">(optional)</span></label><input class="input" id="pr-essay-title" type="text" placeholder="The Unkept Life" /></div>
          <div class="field"><label for="pr-essay-slug">Working paper slug</label><input class="input" id="pr-essay-slug" type="text" placeholder="the-unkept-life" /></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="pr-rel-label">Related app label <span style="font-weight:400;color:var(--muted-2)">(optional)</span></label><input class="input" id="pr-rel-label" type="text" placeholder="Kept" /></div>
          <div class="field"><label for="pr-rel-href">Related app link</label><input class="input" id="pr-rel-href" type="text" placeholder="/apps/#kept" /></div>
        </div>
        <label class="field" style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:4px">
          <input type="checkbox" id="pr-published" style="width:16px;height:16px" />
          <span style="font-size:.9rem;font-weight:500">Published (show on the projects page)</span>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" id="pr-save" type="button">Save</button>
          <button class="btn" id="pr-cancel" type="button">Cancel</button>
          <button class="btn btn-danger" id="pr-delete" type="button" hidden>Delete</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=5"></script>
  <script src="/admin/supabase-config.js?v=5"></script>
  <script src="/admin/js/client.js?v=7"></script>
  <script src="/admin/js/auth.js?v=6"></script>
  <script src="/admin/js/roles.js?v=6"></script>
  <script src="/admin/js/nav.js?v=9"></script>
  <script src="/admin/js/projects-admin.js?v=7"></script>
</body>
</html>
