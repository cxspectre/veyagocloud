<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Finance</h1>
          <p>Where the money is right now. Owners and admins only.</p>
        </div>
        <div class="adm-actions">
          <a class="btn" href="/admin/transactions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Transactions
          </a>
          <a class="btn" href="/admin/invoices">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Invoices
          </a>
          <a class="btn" href="/admin/settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            Sync accounts
          </a>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <div class="dash-stats dash-stats--4" id="fin-stats"></div>

      <div class="adm-split">
        <div class="card-pane" style="margin-bottom:0">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">
            <h2 style="margin:0">Income vs expenses</h2>
            <span class="adm-item-sub">Last 6 months, all accounts</span>
          </div>
          <div id="fin-chart"><div class="skel"></div></div>
        </div>

        <div class="adm-side-sticky">
          <div class="card-pane">
            <h2>Accounts</h2>
            <ul class="adm-list" id="fin-accounts"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
          </div>

          <div class="card-pane" style="margin-bottom:0">
            <h2>Invoices</h2>
            <ul class="adm-list" id="inv-summary"><li class="skel skel-sm"></li><li class="skel skel-sm"></li><li class="skel skel-sm"></li></ul>
            <div class="form-actions">
              <a class="btn btn-sm" href="/admin/invoices">Manage invoices →</a>
            </div>
          </div>
        </div>
      </div>

      <div class="card-pane" style="margin-top:20px;margin-bottom:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">
          <h2 style="margin:0">Recent activity</h2>
          <a class="btn btn-sm" href="/admin/transactions">View all →</a>
        </div>
        <div class="fin-head"><span>Date</span><span>Description</span><span>Category</span><span class="fin-amt">Amount</span></div>
        <div class="fin-list" id="tx-recent"><div class="skel skel-sm"></div><div class="skel skel-sm"></div><div class="skel skel-sm"></div><div class="skel skel-sm"></div></div>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=12"></script>
  <script src="/admin/supabase-config.js?v=12"></script>
  <script src="/admin/js/client.js?v=12"></script>
  <script src="/admin/js/auth.js?v=12"></script>
  <script src="/admin/js/roles.js?v=12"></script>
  <script src="/admin/js/nav.js?v=12"></script>
  <script src="/admin/js/palette.js?v=12"></script>
  <script src="/admin/js/finance.js?v=12"></script>
</body>
</html>
