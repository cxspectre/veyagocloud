<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Finance</h1>
          <p>Mercury, Stripe, and manual entries in one ledger. Owners and admins only — RLS blocks every other role.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="sync-mercury" type="button">Sync Mercury</button>
          <button class="btn" id="sync-stripe" type="button">Sync Stripe</button>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite" style="margin-bottom:12px"></p>

      <div class="adm-stats" id="fin-stats"></div>

      <div class="card-pane" style="margin-top:16px">
        <h2>Last 6 months</h2>
        <div id="fin-chart" style="overflow-x:auto"></div>
      </div>

      <div class="card-pane" style="margin-top:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px">
          <h2 style="margin:0">Transactions</h2>
          <select class="input" id="f-account" style="max-width:220px"><option value="all">All accounts</option></select>
        </div>
        <ul class="adm-list" id="tx-list"></ul>
      </div>

      <div class="card-pane" style="margin-top:16px">
        <h2>Add manual transaction</h2>
        <div class="row-2">
          <div class="field"><label for="m-desc">Description</label><input class="input" id="m-desc" type="text" placeholder="Office rent — July" /></div>
          <div class="field"><label for="m-amount">Amount <span style="font-weight:400;color:var(--muted-2)">(negative = expense)</span></label><input class="input" id="m-amount" type="number" step="0.01" placeholder="-1200.00" /></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="m-date">Date</label><input class="input" id="m-date" type="date" /></div>
          <div class="field"><label for="m-category">Category</label><select class="input" id="m-category"></select></div>
        </div>
        <button class="btn btn-primary" id="m-add-btn" type="button">Add transaction</button>
      </div>

      <div class="card-pane" style="margin-top:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px">
          <h2 style="margin:0">Invoices</h2>
        </div>
        <ul class="adm-list" id="inv-list"></ul>
        <div class="row-2" style="margin-top:14px">
          <div class="field"><label for="i-client">Client</label><input class="input" id="i-client" type="text" placeholder="Acme GmbH" /></div>
          <div class="field"><label for="i-number">Invoice #</label><input class="input" id="i-number" type="text" placeholder="2026-014" /></div>
        </div>
        <div class="row-2">
          <div class="field"><label for="i-amount">Amount</label><input class="input" id="i-amount" type="number" step="0.01" placeholder="2500.00" /></div>
          <div class="field"><label for="i-due">Due date</label><input class="input" id="i-due" type="date" /></div>
        </div>
        <button class="btn btn-primary" id="i-add-btn" type="button">Add invoice</button>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=5"></script>
  <script src="/admin/supabase-config.js?v=5"></script>
  <script src="/admin/js/client.js?v=5"></script>
  <script src="/admin/js/auth.js?v=6"></script>
  <script src="/admin/js/roles.js?v=5"></script>
  <script src="/admin/js/nav.js?v=6"></script>
  <script src="/admin/js/finance.js?v=5"></script>
</body>
</html>
