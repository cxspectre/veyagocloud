<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Team</h1>
          <p>Everyone at Veyago — roles, status, and invites.</p>
        </div>
        <div class="adm-actions">
          <a class="btn btn-primary" id="invite-jump" href="/admin/member-new" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            Add someone
          </a>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <div class="dash-stats dash-stats--4" id="team-stats"></div>

      <div class="card-pane">
        <div class="card-head">
          <h2 style="margin:0">Directory</h2>
          <span class="badge badge-inactive" id="team-count"></span>
        </div>
        <ul class="adm-list" id="team-list"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=12"></script>
  <script src="/admin/supabase-config.js?v=12"></script>
  <script src="/admin/js/client.js?v=12"></script>
  <script src="/admin/js/auth.js?v=12"></script>
  <script src="/admin/js/roles.js?v=12"></script>
  <script src="/admin/js/nav.js?v=12"></script>
  <script src="/admin/js/palette.js?v=12"></script>
  <script src="/admin/js/team.js?v=12"></script>
</body>
</html>
