<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Team</h1>
          <p>Everyone at Veyago — roles, status, and invites.</p>
        </div>
        <div class="adm-actions">
          <button class="btn btn-primary" id="invite-jump" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            Invite member
          </button>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite" style="margin-bottom:12px"></p>

      <div class="adm-stats" id="team-stats"></div>

      <div class="adm-split">
        <div class="card-pane" style="margin-bottom:0">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
            <h2 style="margin:0">Directory</h2>
            <span class="badge badge-inactive" id="team-count"></span>
          </div>
          <ul class="adm-list" id="team-list"></ul>
        </div>

        <div class="adm-side-sticky" id="invite-pane" hidden>
          <div class="card-pane" style="margin-bottom:0">
            <h2>Invite a team member</h2>
            <p style="font-size:.85rem;color:var(--muted);margin-bottom:16px">Sends an invite email and creates their record. Their role decides what they see — RLS enforces it.</p>
            <div class="field"><label for="e-name">Full name</label><input class="input" id="e-name" type="text" placeholder="Alex Doe" /></div>
            <div class="field"><label for="e-email">Email</label><input class="input" id="e-email" type="email" placeholder="alex@example.com" /></div>
            <div class="field"><label for="e-title">Job title</label><input class="input" id="e-title" type="text" placeholder="Personal Assistant" /></div>
            <div class="field"><label for="e-role">Role</label>
              <select class="input" id="e-role">
                <option value="assistant">Assistant — team, onboarding, tasks</option>
                <option value="employee">Employee — team, onboarding, tasks</option>
                <option value="admin">Admin — everything incl. finance</option>
                <option value="owner">Owner — everything incl. finance</option>
              </select>
            </div>
            <div class="field"><label for="e-start">Start date</label><input class="input" id="e-start" type="date" /></div>
            <div class="form-actions"><button class="btn btn-primary" id="invite-btn" type="button">Send invite</button></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=5"></script>
  <script src="/admin/supabase-config.js?v=5"></script>
  <script src="/admin/js/client.js?v=6"></script>
  <script src="/admin/js/auth.js?v=6"></script>
  <script src="/admin/js/roles.js?v=6"></script>
  <script src="/admin/js/nav.js?v=8"></script>
  <script src="/admin/js/team.js?v=8"></script>
</body>
</html>
