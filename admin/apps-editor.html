<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Editor · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

  <!-- Editor-mode shell: full-height, no padding -->
  <div class="adm-shell adm-shell--editor" id="adm-shell" hidden>
    <!-- nav.js injects .adm-sidebar here -->

    <div class="ae-root">

      <!-- Top bar -->
      <header class="ae-topbar">
        <a class="ae-back btn btn-sm" href="/admin/apps.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Apps
        </a>
        <div class="ae-topbar-center">
          <span class="badge badge-in-development" id="status-badge">draft</span>
          <p class="ae-save-hint" id="save-hint"></p>
        </div>
        <div class="ae-topbar-actions">
          <button class="btn" id="save-btn">Save</button>
          <button class="btn btn-primary" id="publish-btn">Publish to catalogue</button>
        </div>
      </header>

      <div class="ae-body">

        <!-- Left: catalogue metadata + section palette -->
        <aside class="ae-sidebar">

          <!-- App icon -->
          <div class="ae-panel">
            <p class="ae-panel-label">App icon</p>
            <div class="ae-cover-drop" id="icon-drop" style="min-height:74px">
              <img class="ae-cover-preview" id="icon-preview" src="" alt="" hidden style="width:74px;height:74px;object-fit:cover;border-radius:16px" />
              <div class="ae-cover-placeholder" id="icon-placeholder" style="padding:14px">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.2"/></svg>
                <span>Upload icon</span>
              </div>
              <input type="file" id="ap-icon-file" accept="image/*" class="ae-file-input" />
            </div>
            <input class="input" id="ap-icon" type="text" placeholder="Or paste icon URL" style="margin-top:8px;font-size:.82rem" />
            <span class="hint" id="ap-icon-status"></span>
          </div>

          <!-- Catalogue details (drives the /apps/ card) -->
          <div class="ae-panel">
            <p class="ae-panel-label">Catalogue card</p>
            <div class="field">
              <label for="ap-name">Name</label>
              <input class="input" id="ap-name" type="text" placeholder="Kept" />
            </div>
            <div class="field">
              <label for="ap-slug">Slug</label>
              <input class="input" id="ap-slug" type="text" placeholder="auto from name" />
              <p class="hint">/apps/<span id="slug-preview">…</span>/</p>
            </div>
            <div class="field">
              <label for="ap-tagline">Tagline</label>
              <input class="input" id="ap-tagline" type="text" placeholder="One plain-voice line" />
            </div>
            <div class="field">
              <label for="ap-desc">Card description</label>
              <textarea class="textarea" id="ap-desc" rows="3" placeholder="1–2 sentences for the catalogue card"></textarea>
            </div>
            <div class="field">
              <label for="ap-status">Status</label>
              <select class="select" id="ap-status">
                <option value="in-development">In development</option>
                <option value="scheduled">Scheduled</option>
                <option value="beta">Beta</option>
                <option value="live">Live</option>
              </select>
            </div>
            <div class="field">
              <label for="ap-window">Launch window <span style="font-weight:400;color:var(--muted-2)">(scheduled)</span></label>
              <input class="input" id="ap-window" type="text" placeholder="Q3 2026" />
            </div>
            <div class="field">
              <label for="ap-category">Category</label>
              <select class="select" id="ap-category">
                <option value="travel">Travel</option>
                <option value="life-admin">Life admin</option>
                <option value="education">Education</option>
                <option value="local-retail">Local retail</option>
              </select>
            </div>
            <div class="field">
              <label for="ap-platforms">Platforms</label>
              <input class="input" id="ap-platforms" type="text" placeholder="iOS, iOS & Android…" />
            </div>
            <div class="field">
              <label for="ap-pricing">Pricing</label>
              <input class="input" id="ap-pricing" type="text" placeholder="Free · one-time unlock" />
            </div>
            <div class="field">
              <label for="ap-store">App Store URL</label>
              <input class="input" id="ap-store" type="text" placeholder="https://apps.apple.com/…" />
            </div>
            <div class="field" style="margin-bottom:0">
              <label for="ap-product">Card link URL <span style="font-weight:400;color:var(--muted-2)">(where the card points)</span></label>
              <input class="input" id="ap-product" type="text" placeholder="/apps/kept/ or https://…" />
            </div>
          </div>

          <!-- Section palette -->
          <div class="ae-panel">
            <p class="ae-panel-label">Add section</p>
            <div class="ae-palette">
              <button class="ae-palette-btn" data-type="hero">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><rect x="3" y="4" width="9" height="16" rx="1"/><path d="M15 7h6M15 11h6M15 15h4"/></svg>
                Hero (text + device)
              </button>
              <button class="ae-palette-btn" data-type="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M3 7h8M3 11h6M3 15h8"/><rect x="15" y="5" width="6" height="14" rx="1.5"/></svg>
                Feature row (image)
              </button>
              <button class="ae-palette-btn" data-type="steps">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><circle cx="6" cy="7" r="2.4"/><circle cx="12" cy="7" r="2.4"/><circle cx="18" cy="7" r="2.4"/><path d="M4 14h4M10 14h4M16 14h4"/></svg>
                Steps (1·2·3)
              </button>
              <button class="ae-palette-btn" data-type="cards">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><rect x="3" y="4" width="7" height="7" rx="1.4"/><rect x="14" y="4" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="6" rx="1.4"/><rect x="14" y="14" width="7" height="6" rx="1.4"/></svg>
                Feature cards
              </button>
              <button class="ae-palette-btn" data-type="cta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M9 12h6"/></svg>
                CTA band (dark)
              </button>
            </div>
            <label class="field" style="display:flex;align-items:center;gap:10px;cursor:pointer;margin:14px 0 0">
              <input type="checkbox" id="ap-published" style="width:16px;height:16px" />
              <span style="font-size:.86rem;font-weight:500">Show on the apps catalogue</span>
            </label>
          </div>

        </aside>

        <!-- Right: live canvas -->
        <div class="ae-canvas-wrap">
          <div class="ae-canvas ape-canvas">

            <!-- Browser chrome -->
            <div class="ae-browser-bar">
              <div class="ae-browser-dots"><span></span><span></span><span></span></div>
              <div class="ae-browser-url">
                veyago.cloud/apps/<span id="url-slug">slug</span>/
              </div>
            </div>

            <!-- Product-page surface — uses real site styles -->
            <div class="ape-surface" id="canvas-body"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/admin/vendor/supabase.js?v=5"></script>
  <script src="/admin/supabase-config.js?v=5"></script>
  <script src="/admin/js/client.js?v=5"></script>
  <script src="/admin/js/auth.js?v=5"></script>
  <script src="/admin/js/roles.js?v=5"></script>
  <script src="/admin/js/nav.js?v=5"></script>
  <script src="/admin/js/apps-editor.js?v=5"></script>
</body>
</html>
