<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Onboarding</h1>
          <p>Where one person stands on the company checklist — tick items off and leave a note on any of them.</p>
        </div>
        <div class="adm-actions">
          <label for="ob-employee" style="font-size:.78rem;font-weight:600;color:var(--muted-2)">Team member</label>
          <select class="input input-sm" id="ob-employee"></select>
          <a class="btn btn-sm" id="ob-manage-link" href="/admin/checklist" hidden>
            Manage checklist
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <!-- Progress hero -->
      <div class="card-pane" id="ob-hero" hidden>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div class="avatar" id="ob-hero-avatar" style="width:44px;height:44px;font-size:.95rem"></div>
          <div style="flex:1;min-width:220px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px">
              <div style="font-weight:600" id="ob-hero-name"></div>
              <div style="font-size:.85rem;color:var(--muted)" id="ob-hero-count"></div>
            </div>
            <div class="adm-progress" id="ob-hero-bar"><i style="width:0%"></i></div>
            <div style="font-size:.78rem;color:var(--muted-2);margin-top:8px" id="ob-hero-cats"></div>
          </div>
        </div>
      </div>

      <div class="card-pane">
        <div class="card-head">
          <h2 style="margin:0">Checklist</h2>
          <span class="badge badge-inactive" id="ob-count"></span>
        </div>
        <ul class="adm-list" id="ob-list"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=12"></script>
  <script src="/admin/supabase-config.js?v=12"></script>
  <script src="/admin/js/client.js?v=12"></script>
  <script src="/admin/js/auth.js?v=12"></script>
  <script src="/admin/js/roles.js?v=12"></script>
  <script src="/admin/js/nav.js?v=12"></script>
  <script src="/admin/js/palette.js?v=12"></script>
  <script src="/admin/js/onboarding.js?v=12"></script>
</body>
</html>
