<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Onboarding</h1>
          <p>The checklist every new hire works through.</p>
        </div>
        <div class="adm-actions">
          <label for="ob-employee" style="font-size:.78rem;font-weight:600;color:var(--muted-2)">Team member</label>
          <select class="input" id="ob-employee" style="width:auto;min-width:180px"></select>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite" style="margin-bottom:12px"></p>

      <!-- Progress hero -->
      <div class="card-pane" id="ob-hero" hidden>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div class="avatar" id="ob-hero-avatar" style="width:44px;height:44px;font-size:.95rem"></div>
          <div style="flex:1;min-width:220px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px">
              <div style="font-weight:600" id="ob-hero-name"></div>
              <div style="font-size:.85rem;color:var(--muted)" id="ob-hero-count"></div>
            </div>
            <div class="adm-progress" id="ob-hero-bar"><i style="width:0%"></i></div>
            <div style="font-size:.78rem;color:var(--muted-2);margin-top:8px" id="ob-hero-cats"></div>
          </div>
        </div>
      </div>

      <div class="adm-split">
        <div class="card-pane" style="margin-bottom:0">
          <h2>Checklist</h2>
          <ul class="adm-list" id="ob-list"></ul>
        </div>

        <div class="adm-side-sticky" id="ob-manage-pane" hidden>
          <div class="card-pane" style="margin-bottom:0">
            <h2>Manage checklist</h2>
            <p style="font-size:.85rem;color:var(--muted);margin-bottom:16px"><strong>Applies to everyone.</strong> Removing an item deactivates it — history is kept.</p>
            <div class="field"><label for="ob-new-title">Title</label><input class="input" id="ob-new-title" type="text" placeholder="Set up payroll details" /></div>
            <div class="field"><label for="ob-new-category">Category</label>
              <select class="input" id="ob-new-category">
                <option value="general">General</option>
                <option value="accounts">Accounts</option>
                <option value="legal">Legal</option>
                <option value="tools">Tools</option>
              </select>
            </div>
            <div class="field"><label for="ob-new-desc">Description <span style="font-weight:400;color:var(--muted-2)">(optional)</span></label><input class="input" id="ob-new-desc" type="text" placeholder="What done looks like" /></div>
            <div class="form-actions"><button class="btn btn-primary" id="ob-add-btn" type="button">Add item</button></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=5"></script>
  <script src="/admin/supabase-config.js?v=5"></script>
  <script src="/admin/js/client.js?v=6"></script>
  <script src="/admin/js/auth.js?v=6"></script>
  <script src="/admin/js/roles.js?v=6"></script>
  <script src="/admin/js/nav.js?v=8"></script>
  <script src="/admin/js/onboarding.js?v=8"></script>
</body>
</html>
