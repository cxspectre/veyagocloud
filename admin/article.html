<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Editor · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

  <!-- The adm-shell is editor-mode: no padding, full-height grid -->
  <div class="adm-shell adm-shell--editor" id="adm-shell" hidden>
    <!-- nav.js injects .adm-sidebar here -->

    <div class="ae-root">

      <!-- Top bar -->
      <header class="ae-topbar">
        <a class="ae-back btn btn-sm" href="/admin/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Dashboard
        </a>
        <div class="ae-topbar-center">
          <span class="badge badge-draft" id="status-badge">draft</span>
          <p class="ae-save-hint" id="save-hint"></p>
        </div>
        <div class="ae-topbar-actions">
          <button class="btn" id="save-btn">Save draft</button>
          <button class="btn btn-primary" id="publish-btn">Publish</button>
        </div>
      </header>

      <div class="ae-body">

        <!-- Left: metadata + block palette -->
        <aside class="ae-sidebar">

          <!-- Cover image -->
          <div class="ae-panel">
            <p class="ae-panel-label">Cover image</p>
            <div class="ae-cover-drop" id="cover-drop">
              <img class="ae-cover-preview" id="cover-preview" src="" alt="" hidden />
              <div class="ae-cover-placeholder" id="cover-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 13l5-4 4 4 3-2 5 3"/></svg>
                <span>Upload cover</span>
              </div>
              <input type="file" id="cover-file" accept="image/*" class="ae-file-input" />
            </div>
            <input class="input" id="f-cover-url" type="text" placeholder="Or paste image URL" style="margin-top:8px;font-size:.82rem" />
          </div>

          <!-- Metadata -->
          <div class="ae-panel">
            <p class="ae-panel-label">Metadata</p>
            <div class="field">
              <label for="f-slug">Slug</label>
              <input class="input" id="f-slug" type="text" placeholder="auto from title" />
              <p class="hint">/journal/<span id="slug-preview">…</span>/</p>
            </div>
            <div class="field" style="margin-bottom:0">
              <label for="f-excerpt">Excerpt <span style="font-weight:400;color:var(--muted-2)">(list card + social)</span></label>
              <textarea class="textarea" id="f-excerpt" rows="3" placeholder="One or two sentences…"></textarea>
            </div>
          </div>

          <!-- Block palette -->
          <div class="ae-panel">
            <p class="ae-panel-label">Add block</p>
            <div class="ae-palette">
              <button class="ae-palette-btn" data-type="section_marker">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="10" x2="14" y2="10"/></svg>
                Section marker
              </button>
              <button class="ae-palette-btn" data-type="heading">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
                Heading
              </button>
              <button class="ae-palette-btn" data-type="text">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M4 6h16M4 10h16M4 14h16M4 18h10"/></svg>
                Text
              </button>
              <button class="ae-palette-btn" data-type="image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 13l5-4 4 4 3-2 5 3"/></svg>
                Image
              </button>
              <button class="ae-palette-btn" data-type="quote">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
                Pull quote
              </button>
              <button class="ae-palette-btn" data-type="divider">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><line x1="3" y1="12" x2="21" y2="12"/></svg>
                Divider
              </button>
            </div>
          </div>

        </aside>

        <!-- Right: live canvas -->
        <div class="ae-canvas-wrap">
          <div class="ae-canvas">

            <!-- Browser chrome -->
            <div class="ae-browser-bar">
              <div class="ae-browser-dots">
                <span></span><span></span><span></span>
              </div>
              <div class="ae-browser-url">
                veyago.cloud/journal/<span id="url-slug">slug</span>/
              </div>
            </div>

            <!-- Article surface — uses real site styles -->
            <div class="ae-surface paper-journal" style="--st:#0071e3">

              <!-- Masthead — always present, directly editable -->
              <div class="paper-masthead ae-masthead">
                <p class="paper-kicker">← Journal · Article</p>
                <h1 class="paper-title ae-ce"
                    id="canvas-title"
                    contenteditable="true"
                    spellcheck="true"
                    data-ph="Article title"></h1>
                <p class="paper-dek ae-ce"
                   id="canvas-dek"
                   contenteditable="true"
                   spellcheck="true"
                   data-ph="Subtitle or standfirst (optional)"></p>
                <p class="paper-meta" id="canvas-meta">Just now · 1 min read</p>
              </div>

              <!-- Block body -->
              <div class="paper-body ae-block-body" id="canvas-body"></div>

            </div>
            <!-- /surface -->

          </div>
        </div>
        <!-- /canvas wrap -->

      </div>
    </div>
  </div>

  <script src="/admin/vendor/supabase.js?v=5"></script>
  <script src="/admin/supabase-config.js?v=5"></script>
  <script src="/admin/js/client.js?v=6"></script>
  <script src="/admin/js/auth.js?v=6"></script>
  <script src="/admin/js/roles.js?v=6"></script>
  <script src="/admin/js/nav.js?v=8"></script>
  <script src="/admin/js/article.js?v=5"></script>
</body>
</html>
