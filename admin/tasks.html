<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Tasks</h1>
          <p>Assign work, track status, hit deadlines.</p>
        </div>
        <div class="adm-actions">
          <!-- A real destination, not a smooth-scroll. This used to be a
               primary button that only scrolled a side panel into view —
               which on a narrow screen meant scrolling past the entire board
               to the bottom of the page. -->
          <a class="btn btn-primary" href="/admin/task-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New task
          </a>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <div class="dash-stats dash-stats--4" id="task-stats"></div>

      <div class="adm-toolbar">
        <label for="f-status">Status</label>
        <select class="input input-sm" id="f-status">
          <option value="open">Open</option>
          <option value="all">All</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
        </select>
        <label for="f-assignee">Assignee</label>
        <select class="input input-sm" id="f-assignee">
          <option value="all">Everyone</option>
        </select>
        <!-- Toggles the assignee filter to the signed-in user's employee row.
             Hidden by JS until selfEmployee is resolved, so it never shows for
             a legacy admin who has no employees row. -->
        <button class="btn btn-sm" id="f-mine" type="button" hidden>Mine</button>
        <input class="input input-sm" id="f-search" type="search"
               placeholder="Search tasks…" autocomplete="off"
               aria-label="Search tasks" style="flex:1;min-width:100px;max-width:220px" />
        <span class="adm-toolbar-count" id="task-count"></span>
        <!-- View toggle sits at the far right of the toolbar so filters and view
             mode read as one control strip. -->
        <div class="task-view-toggle">
          <button class="btn btn-sm btn-primary" id="view-list" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            List
          </button>
          <button class="btn btn-sm" id="view-cal" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Calendar
          </button>
        </div>
      </div>

      <!-- Quick add. One line, because the everyday case is a personal to-do
           and it should cost one line. It always assigns to you, so it can
           never email anyone — delegating is a different act and lives on
           /admin/task-new, where the email is named before you commit. -->
      <form class="task-quick" id="quick-add">
        <svg class="task-quick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <input class="input" id="q-title" type="text" autocomplete="off"
               placeholder="Add a task…" aria-label="Add a task" />
        <!-- Optional due date on quick-add. Hidden on very narrow screens where
             the bar already has no room. Cleared along with the title after a
             successful add. -->
        <input class="input input-sm task-quick-date" id="q-due" type="date"
               title="Due date (optional)" aria-label="Due date" />
        <button class="btn btn-primary btn-sm" id="q-add-btn" type="submit">Add</button>
      </form>

      <ul class="adm-list" id="task-list"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
      <div id="task-cal" class="task-cal" hidden></div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=12"></script>
  <script src="/admin/supabase-config.js?v=12"></script>
  <script src="/admin/js/client.js?v=12"></script>
  <script src="/admin/js/auth.js?v=12"></script>
  <script src="/admin/js/roles.js?v=12"></script>
  <script src="/admin/js/nav.js?v=12"></script>
  <script src="/admin/js/palette.js?v=12"></script>
  <script src="/admin/js/task-status.js?v=12"></script>
  <script src="/admin/js/task-notify.js?v=12"></script>
  <script src="/admin/js/tasks.js?v=12"></script>
  <script src="/admin/js/task-calendar.js?v=12"></script>
</body>
</html>
