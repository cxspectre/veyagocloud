<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Tasks</h1>
          <p>Assign work, track status, hit deadlines.</p>
        </div>
        <div class="adm-actions">
          <!-- A real destination, not a smooth-scroll. This used to be a
               primary button that only scrolled a side panel into view —
               which on a narrow screen meant scrolling past the entire board
               to the bottom of the page. -->
          <a class="btn btn-primary" href="/admin/task-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New task
          </a>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <div class="dash-stats dash-stats--4" id="task-stats"></div>

      <div class="adm-toolbar">
        <label for="f-status">Status</label>
        <select class="input input-sm" id="f-status">
          <option value="open">Open</option>
          <option value="all">All</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
        </select>
        <label for="f-assignee">Assignee</label>
        <select class="input input-sm" id="f-assignee">
          <option value="all">Everyone</option>
        </select>
        <span class="adm-toolbar-count" id="task-count"></span>
      </div>

      <!-- Quick add. One line, because the everyday case is a personal to-do
           and it should cost one line. It always assigns to you, so it can
           never email anyone — delegating is a different act and lives on
           /admin/task-new, where the email is named before you commit. -->
      <form class="task-quick" id="quick-add">
        <svg class="task-quick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <input class="input" id="q-title" type="text" autocomplete="off"
               placeholder="Add a task for yourself…" aria-label="Add a task for yourself" />
        <button class="btn btn-primary btn-sm" id="q-add-btn" type="submit">Add</button>
      </form>

      <ul class="adm-list" id="task-list"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=12"></script>
  <script src="/admin/supabase-config.js?v=12"></script>
  <script src="/admin/js/client.js?v=12"></script>
  <script src="/admin/js/auth.js?v=12"></script>
  <script src="/admin/js/roles.js?v=12"></script>
  <script src="/admin/js/nav.js?v=12"></script>
  <script src="/admin/js/palette.js?v=12"></script>
  <script src="/admin/js/task-status.js?v=12"></script>
  <script src="/admin/js/task-notify.js?v=12"></script>
  <script src="/admin/js/tasks.js?v=12"></script>
</body>
</html>
