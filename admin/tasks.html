<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks · Veyago Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="adm-shell" id="adm-shell" hidden>
    <main class="adm-main">
      <div class="adm-page-head">
        <div>
          <h1>Tasks</h1>
          <p>Assign work, track status, hit deadlines.</p>
        </div>
        <div class="adm-actions">
          <button class="btn btn-primary" id="task-jump" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New task
          </button>
        </div>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <div class="dash-stats dash-stats--4" id="task-stats"></div>

      <div class="adm-toolbar">
        <label for="f-status">Status</label>
        <select class="input input-sm" id="f-status">
          <option value="open">Open</option>
          <option value="all">All</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
        </select>
        <label for="f-assignee">Assignee</label>
        <select class="input input-sm" id="f-assignee">
          <option value="all">Everyone</option>
        </select>
        <span class="adm-toolbar-count" id="task-count"></span>
      </div>

      <div class="adm-split">
        <div class="u-min0">
          <ul class="adm-list" id="task-list"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
        </div>

        <div class="adm-side-sticky">
          <div class="card-pane" style="margin-bottom:0" id="new-task-pane">
            <h2>New task</h2>
            <div class="field"><label for="t-title">Title</label><input class="input" id="t-title" type="text" placeholder="Book flights for the Berlin trip" /></div>
            <div class="field"><label for="t-assignee">Assign to</label><select class="input" id="t-assignee"></select></div>
            <div class="row-2">
              <div class="field"><label for="t-priority">Priority</label>
                <select class="input" id="t-priority">
                  <option value="low">Low</option>
                  <option value="normal" selected>Normal</option>
                  <option value="high">High</option>
                  <option value="urgent">Urgent</option>
                </select>
              </div>
              <div class="field"><label for="t-due">Due date</label><input class="input" id="t-due" type="date" /></div>
            </div>
            <div class="field"><label for="t-details">Details <span class="qualifier">(optional)</span></label><textarea class="input" id="t-details" rows="3" placeholder="Links, context, what done looks like"></textarea></div>
            <div class="form-actions"><button class="btn btn-primary" id="t-add-btn" type="button">Create task</button></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/vendor/supabase.js?v=12"></script>
  <script src="/admin/supabase-config.js?v=12"></script>
  <script src="/admin/js/client.js?v=12"></script>
  <script src="/admin/js/auth.js?v=12"></script>
  <script src="/admin/js/roles.js?v=12"></script>
  <script src="/admin/js/nav.js?v=12"></script>
  <script src="/admin/js/palette.js?v=12"></script>
  <script src="/admin/js/tasks.js?v=12"></script>
</body>
</html>
