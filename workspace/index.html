<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace sign-in | Veyago</title>
  <meta name="description" content="The Veyago Workspace is where the studio runs mail, tickets, projects and invoices. Sign-in opens with it; write to us until then." />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <link rel="canonical" href="https://www.veyago.cloud/workspace/" />
  <meta name="robots" content="noindex,follow" />
  <meta property="og:title" content="Workspace sign-in | Veyago" />
  <meta property="og:description" content="The Veyago Workspace is where the studio runs mail, tickets, projects and invoices. Sign-in opens with it; write to us until then." />
  <meta property="og:url" content="https://www.veyago.cloud/workspace/" />
  <meta property="og:site_name" content="Veyago" />
  <meta property="og:type" content="website" />
</head>
<body>
  <a class="auth-back" href="/login/">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back
  </a>

  <main class="auth" id="main">
    <div class="auth-inner auth-inner-narrow">
      <div class="auth-panel">
        <span class="auth-tile auth-tile-studio" aria-hidden="true">V</span>
        <h1>Veyago Workspace</h1>
        <p class="auth-lede">Sign-in opens when the workspace does.</p>
        <a class="auth-btn" href="mailto:hello@veyago.cloud?subject=Workspace%20access">
          Email us
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <p class="auth-note">Looking for your project? <a href="/portal/">Client Portal</a></p>
    </div>
  </main>
</body>
</html>
